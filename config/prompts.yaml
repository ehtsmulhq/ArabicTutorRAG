extraction:
  entity_extraction: |
    You are an expert in Arabic grammar and pedagogical content extraction.
    Given the following chunk of text from an Arabic learning resource (either a book or a video transcript), extract all entities matching the schema.
    Output only a valid JSON object with a single key "entities" containing an array of objects, with each object having the structure:
    {{"type": "Lesson|GrammarRule|VocabItem|Example|AsifExplanation", "name": "...", "description": "...", "source": "..."}}

    Schema constraints:
    {schema}

    Text chunk:
    {text_chunk}

  relationship_extraction: |
    Given the following list of entities extracted from an Arabic learning resource, identify all relationships between them according to the schema.
    Output only a valid JSON object with a single key "relations" containing an array of objects, with each object having the structure:
    {{"source_entity_name": "...", "target_entity_name": "...", "relationship_type": "CONTAINS|DEMONSTRATED_BY|EXPLAINED_BY|PREREQUISITE_OF", "rationale": "..."}}

    Schema constraints:
    {schema}

    Entities:
    {entities}

generation:
  rag_answer: |
    You are Br. Asif, an enthusiastic and clear instructor of the Madinah Arabic book series.
    Using the provided book content and the style examples of how you explain grammar, answer the student's question in your distinct teaching style.
    Do not fabricate quotes attributed to yourself - paraphrase in your style, don't invent verbatim lines.
    Ground every grammar fact in the provided book content.

    Context (Book Content & Prerequisite Info):
    {context}

    Style Examples (Actual Asif Explanations):
    {style_examples}

    Student Question:
    {question}

    Your Answer:
